name: Deploy to Cloudflare Pages

# 这个仓库的根目录就是网页版的站点根（index.html 与 js/、style.css 都在根上）。
# 每次推送到 main：GitHub Pages 由平台自己部署，Cloudflare Pages 由这个 Action 部署。
# 抄的是作品集里 Sinoky 已跑通的那份（cloudflare/pages-action@v1 + 仓库 Secrets），
# 区别只有：本站点没有构建步骤，需要先把仓库自己的 .github 和 README 排除在上传目录之外。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 第一次实跑（2026-09-26 run 36215458552）3 秒就红在 Set up job，人看不出为什么。
      # Secrets 到位后如果还红，这一步会直接给一句人话，而不是让人去猜是哪个变量没填。
      - name: 先确认 Secrets 到位
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::仓库 Settings → Secrets and variables → Actions 里还没有 CLOUDFLARE_API_TOKEN。补上后在本页 Run workflow 重跑即可（值只进 GitHub 后台，不进仓库、不进聊天记录）。"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN 已就位（长度 ${#CLOUDFLARE_API_TOKEN}，值不打印）"

      # updates/ 是安卓包的第二更新源（单个 APK 约 50MB）。Cloudflare Pages 单文件上限 25MB，
      # 带进 dist 会让整个部署红掉，而网页版本来也不需要它，所以这里一并排除。
      # ⚠️ 这个排除只能写在这里（模板）：deploy/repo 每次打包都会被模板覆盖，改那份等于没改。
      - name: 只挑站点文件进 dist（排除 .github、README、updates 与 dist 自己）
        run: |
          mkdir -p dist
          find . -maxdepth 1 -mindepth 1 \
            -not -path './.git*' -not -name 'README.md' -not -name 'dist' -not -name 'updates' \
            -exec cp -R {} dist/ \;
          test ! -e dist/updates
          test -f dist/index.html
          test -f dist/js/app.js
          touch dist/.nojekyll
          ls -l dist dist/js

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID 是标识符不是凭据（没有 token 它什么都打不开），且已在康哥自己两份产品文档里
          # 交叉确认过同一个值（词汇生长 Worker 部署记录 + Sinoky 部署笔记），所以这里给了默认值：
          # 他只需要在 Secrets 里补那一个 token，第二个 Secret 可省。
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'd24caa86ff464fd98e1c95a11c814a61' }}
          projectName: youhuaqianle
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
