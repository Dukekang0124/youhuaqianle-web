name: web-healthcheck

# 网页版没有服务端、没有构建机，唯一的失效方式是「地址还在，但内容不是这一版」或「某一侧根本没部署上」。
# 每 6 小时按浏览器真正会请求的地址逐个回读，任一条不符 → workflow 失败 → GitHub 自动邮件通知仓库所有者。
# 抄的是作品集里 英语开口练 已跑通的 cron 巡检形态（那边走 pages.dev + version.json + APK 角标）；
# 本站点改成核对「页脚版本号 + 备份保鲜阈值常量 + 全部 JS/CSS 可取回且 MIME 正确」+ 更新源与仓库同版本。
#
# 四类地址（2026-09-28 按实测现状分组，别把「没部署」和「部署坏了」混成同一种红）：
#   SITE_BASES      网页版对外地址，必须绿
#   REPO_BASES      原样服务本仓库根的地址（开了 Pages 才有），下载页与更新源从这里查
#   STANDBY_BASES   还没铺成的备用站：探到了就全量检查，没部署只打印一行，不判红
#   UPDATE_MIRRORS  App 内建的旧更新站（受平台配额限制，可能落后本仓库）：只报差距，不判红

on:
  schedule:
    - cron: '23 */6 * * *' # UTC 00/06/12/18 :23（北京时间 08:23 / 14:23 / 20:23 / 02:23）
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SITE_BASES: "https://youhuaqianle-app-iayb1usbncc.qoder.website https://dukekang0124.github.io/youhuaqianle-web"
  REPO_BASES: "https://dukekang0124.github.io/youhuaqianle-web"
  STANDBY_BASES: "https://youhuaqianle.pages.dev"
  UPDATE_BASES: "https://dukekang0124.github.io/youhuaqianle-web/updates https://raw.githubusercontent.com/Dukekang0124/youhuaqianle-web/main/updates"
  UPDATE_MIRRORS: "https://youhuaqianle-update-iayb1usbncc.qoder.website"

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 线上一致性巡检
        run: |
          python3 - <<'PY'
          import os, re, sys, json, socket, struct, hashlib, urllib.request, urllib.error

          UA = {"User-Agent": "yhq-web-healthcheck/1.0 (+github-actions)"}
          app = open("js/app.js", encoding="utf-8").read()
          store = open("js/store.js", encoding="utf-8").read()
          expect_ver = re.search(r"网页版 (v[0-9.]+)", app).group(1)
          expect_days = re.search(r"BACKUP_STALE_DAYS\s*=\s*(\d+)", store).group(1)
          assets = ["index.html", "style.css"] + [
              "js/" + n for n in ["app.js", "cn.js", "lexicon.js", "money.js", "parser.js", "stats.js", "store.js"]
          ]
          OK_MIME = {"html": "text/html", "js": "javascript", "css": "text/css"}

          def fetch(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, r.read(), r.headers.get("content-type", "")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(), e.headers.get("content-type", "")
              except Exception as e:
                  return -1, repr(e).encode(), ""

          def head(url):
              req = urllib.request.Request(url, headers=UA, method="HEAD")
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, r.headers.get("content-length", "")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:
                  return -1, repr(e)[:70]

          def resolve(base, url):
              # 与客户端 resolveDownloadUrl 同一条规则：绝对地址原样用，相对/裸文件名拼在清单所在目录后面
              if re.match(r"^https?:", url):
                  return url
              return base.rstrip("/") + "/" + url.lstrip("/")

          def range8k(url):
              # 送达判据：HEAD 200 + content-length 只证明文件在；取回开头 8 KiB 与本地同偏移比字节，
              # 才能抓住「中间层改写/缓存了另一版」（jsDelivr 那次就是这么露馅的）。
              req = urllib.request.Request(url, headers=dict(UA, **{"Range": "bytes=0-8191", "Cache-Control": "no-cache"}))
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, r.read(8192), r.headers.get("content-range", "")
              except urllib.error.HTTPError as e:
                  return e.code, b"", ""
              except Exception as e:
                  return -1, repr(e)[:70].encode(), ""

          def check_site(base, fails, warns):
              for name in assets:
                  st, body, ctype = fetch(base + "/" + name + "?v=" + expect_ver)
                  text = body.decode("utf-8", "replace")
                  ext = name.rsplit(".", 1)[-1]
                  if st != 200:
                      fails.append("%s/%s -> HTTP %s" % (base, name, st))
                      continue
                  if OK_MIME[ext] not in ctype and ext != "css":
                      # ES Module 被当 text/plain 发时浏览器直接拒绝执行：地址能开、页面白屏
                      fails.append("%s/%s -> MIME %s" % (base, name, ctype))
                  if name == "js/app.js" and expect_ver not in text:
                      fails.append("%s 的 app.js 里没有 %s（线上还是旧版）" % (base, expect_ver))
                  if name == "js/store.js" and ("BACKUP_STALE_DAYS = " + expect_days) not in text.replace("  ", " "):
                      fails.append("%s 的备份保鲜阈值与仓库不一致" % base)
              print("[%s] 站点 %d 个文件检查完毕" % (base, len(assets)))

          print("== 又花钱了 网页版 线上巡检 ==")
          print("期望：", expect_ver, "| 备份保鲜阈值", expect_days, "天 |", len(assets), "个文件")
          fails, warns, served = [], [], []

          for base in os.environ["SITE_BASES"].split():
              check_site(base, fails, warns)

          # 备用站：先探一口气，没铺成（DNS 都不存在 / 404）就只说一句，别和「铺坏了」混成同一种红
          for base in os.environ["STANDBY_BASES"].split():
              st, _, _ = fetch(base + "/index.html")
              if st != 200:
                  warns.append("%s 未部署（探到 HTTP %s）：Cloudflare Pages 那边从没成功过，网页版只能靠上面两个地址" % (base, st))
              else:
                  check_site(base, fails, warns)

          # ---- 更新源：App 能不能知道「有线上新版」全靠这里 ----
          # 期望值不写死，全部从 checkout 下来的 updates/version.json 现读：推一次包就等于改期望，
          # 巡检永远拿「仓库里这一版」对「线上这一版」，不会出现「脚本守着旧版本号报绿」。
          if os.path.exists("updates/version.json"):
              local = open("updates/version.json", "rb").read()
              local_sha = hashlib.sha256(local).hexdigest()
              vj = json.loads(local.decode("utf-8"))
              apk = vj["apk"]
              name, size = apk["url"], apk["size"]
              print("\n-- 更新源（期望 versionCode %s / %s B / md5 %s）--" % (apk["versionCode"], size, apk["md5"]))
              for ub in os.environ["UPDATE_BASES"].split():
                  st, body, _ = fetch(ub + "/version.json")
                  if st != 200:
                      hint = "（GitHub Pages 未开启：Settings → Pages → Deploy from branch, main / root）" if "github.io" in ub else ""
                      fails.append("更新源 %s/version.json -> HTTP %s%s" % (ub, st, hint))
                      continue
                  if hashlib.sha256(body).hexdigest() != local_sha:
                      got = json.loads(body.decode("utf-8", "replace")).get("apk", {}).get("versionCode")
                      fails.append("更新源 %s 的 version.json 与仓库不是同一份（线上 %s / 仓库 %s）" % (ub, got, apk["versionCode"]))
                      continue
                  # HEAD 只证明「文件在、长度对」，整包能不能下完只有客户端知道（MD5 在 App 里校）
                  hst, clen = head(resolve(ub + "/", name))
                  if hst != 200:
                      fails.append("更新源 %s/%s -> HEAD HTTP %s" % (ub, name, hst))
                  elif clen and int(clen) != size:
                      fails.append("更新源 %s/%s 长度 %s ≠ version.json 的 %s" % (ub, name, clen, size))
                  else:
                      served.append(ub)
                      print("  [%s] version.json 逐字节一致 · %s HEAD %s B（整包下载由 App 端 MD5 兜底）" % (ub, name, clen or "?"))
                      # ---- 分块：2045 起 App 真正下的是 parts/*，只比整包 HEAD 等于没检 ----
                      # 逐块取远端开头 8 KiB 与本地同偏移比字节；长度对得上但内容被中间层换掉的，
                      # 只有这一步抓得住（jsDelivr 那次就是「版本号对、字节永远对不上」）。
                      pd = apk.get("parts")
                      plist = (pd.get("parts") if isinstance(pd, dict) else pd) or []
                      if not plist:
                          fails.append("更新源 %s 的清单里没有分块信息（2045 起 App 按 parts 下载）" % ub)
                      else:
                          psum = sum(int(p.get("size") or 0) for p in plist)
                          if psum != size:
                              fails.append("更新源 %s 分块合计 %s ≠ 整包 %s" % (ub, psum, size))
                          else:
                            # 每一块单独判，红的时候能一眼指出是哪一块
                            for p in plist:
                                pu = p.get("url") or ""
                                ppath = os.path.join("updates", *pu.split("/"))
                                if not os.path.exists(ppath):
                                    fails.append("更新源 %s 声明了 %s，但仓库里没有这块" % (ub, pu))
                                    continue
                                want = open(ppath, "rb").read(8192)
                                pst, pbody, crange = range8k(resolve(ub + "/", pu))
                                if pst not in (200, 206):
                                    fails.append("更新源 %s/%s -> Range HTTP %s" % (ub, pu, pst))
                                    continue
                                if pbody[:len(want)] != want:
                                    fails.append("更新源 %s/%s 开头 %d B 与仓库不一致（中间层改写或缓存了另一版）" % (ub, pu, len(want)))
                                    continue
                                mode = "206 续传" if pst == 206 else "服务端没理会 Range，回 200 整份，只比对了开头"
                                print("    %s 开头 %d B 一致（%s）" % (pu, len(want), mode))
              for mb in os.environ["UPDATE_MIRRORS"].split():
                  st, body, _ = fetch(mb.rstrip("/") + "/version.json")
                  if st != 200:
                      warns.append("旧更新站 %s/version.json -> HTTP %s" % (mb, st))
                      continue
                  m = json.loads(body.decode("utf-8", "replace")).get("apk", {})
                  mc = m.get("versionCode")
                  line = "旧更新站 %s 报的是 versionCode %s（仓库 %s）" % (mb, mc, apk["versionCode"])
                  warns.append(line + ("｜落后，App 在这个源上收不到新版" if mc != apk["versionCode"] else "｜与仓库同版"))
                  if mc == apk["versionCode"]:
                      served.append(mb)
                  hst, clen = head(resolve(mb.rstrip("/") + "/", m.get("url", "")))
                  print("  [%s] HEAD %s -> HTTP %s %s B" % (mb, m.get("url"), hst, clen or "?"))
              # ---- 公共 DNS 视角：海外 runner 的 200 不等于用户问得到 ----
              # 上面每一条绿都是这台 GitHub 机器在海外取的，所以这里额外用「国内解析器」问一遍那几个域名。
              # 为什么必须有对照组：2026-09-28 在本机（Windows + fastgithub 加速器）拿 223.5.5.5 问
              # raw.githubusercontent.com 回的是 127.0.0.1，一度被写成「国内 DNS 污染 GitHub」；当晚换
              # 1.1.1.1 / 8.8.8.8 / 9.9.9.9 再问，**回的还是 127.0.0.1** —— 那个回环地址是本机网络栈造的，
              # 跟国内解析器没关系。所以只有「国内回环 + 境外真 IP」才叫国内侧的问题；
              # 两边都回环 = 这台机器自己在拦，结论只能是「判不了」。
              # 另一条要如实说的边界：runner 在海外，AliDNS 是按来源地做智能解析的，
              # 它给这台 runner 的答案不等于给国内手机的答案——这一项只能当旁证，真机那一条（走查 144）才算验收。
              # 结论一律只进 warns 不判红（解析现状不是本仓库能修的，天天邮件只会把告警训成噪音），但每次都要打印。
              CN_RESOLVERS = ["223.5.5.5", "119.29.29.29"]
              FOREIGN_RESOLVERS = ["1.1.1.1", "9.9.9.9"]

              def qname(n):
                  return b"".join(bytes([len(p)]) + p.encode() for p in n.split(".")) + b"\x00"

              def dns_a(host, server, timeout=3.0):
                  pkt = struct.pack(">HHHHHH", 0x4849, 0x0100, 1, 0, 0, 0) + qname(host) + struct.pack(">HH", 1, 1)
                  s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  s.settimeout(timeout)
                  try:
                      s.sendto(pkt, (server, 53))
                      data, _ = s.recvfrom(2048)
                  except Exception as e:
                      return None, repr(e)[:50]
                  finally:
                      s.close()
                  if len(data) < 12:
                      return None, "包太短"
                  ancount = struct.unpack(">H", data[6:8])[0]
                  i = 12
                  while i < len(data) and data[i]:
                      i += 1 + data[i]
                  i += 5
                  ips = []
                  for _ in range(ancount):
                      if i + 12 > len(data):
                          break
                      if data[i] & 0xC0:
                          i += 2
                      else:
                          while i < len(data) and data[i]:
                              i += 1 + data[i]
                          i += 1
                      if i + 10 > len(data):
                          break
                      rtype, _, _, rdlen = struct.unpack(">HHIH", data[i:i + 10])
                      i += 10
                      rd = data[i:i + rdlen]
                      i += rdlen
                      if rtype == 1 and rdlen == 4:
                          ips.append(".".join(str(b) for b in rd))
                  return ips, ""

              def host_of(u):
                  return u.split("//")[1].split("/")[0]

              def ask(host, servers):
                  got, errs = [], []
                  for srv in servers:
                      ips, err = dns_a(host, srv)
                      if err:
                          errs.append("%s:%s" % (srv, err))
                      else:
                          got += ips
                  uniq = sorted(set(got))
                  loop = bool(uniq) and all(ip.startswith("127.") for ip in uniq)
                  return uniq, loop, errs

              print("\n-- 公共 DNS 怎么看这几个域名（国内 223.5.5.5/119.29.29.29 · 对照 1.1.1.1/9.9.9.9）--")
              verdicts = {}
              for h in sorted({host_of(u) for u in os.environ["UPDATE_BASES"].split()} | {host_of(u) for u in os.environ["UPDATE_MIRRORS"].split()}):
                  cn, cn_loop, cn_err = ask(h, CN_RESOLVERS)
                  fg, fg_loop, fg_err = ask(h, FOREIGN_RESOLVERS)
                  if cn_loop and not fg_loop and fg:
                      verdicts[h] = "poisoned"  # 只有国内回环，境外给的是真 IP：国内侧解析问题
                      line = "⚠ 只有国内解析器回 127.0.0.1（境外回 %s）：国内手机问不到这个域名" % ",".join(fg[:2])
                      warns.append("国内公共 DNS 把 %s 解析成 127.0.0.1 而境外解析器给真 IP：没挂代理的手机连 IP 都拿不到，App 内置这条地址在他的网络里等于不存在" % h)
                  elif cn_loop and fg_loop:
                      verdicts[h] = "intercepted"  # 两边都回环：这台 runner 自己也在某个加速器后面，判不了
                      line = "⚠ 国内与境外解析器都回 127.0.0.1：这台 runner 的网络在拦 GitHub，本机结论与手机无关（不作为「国内污染」的证据）"
                      warns.append("%s 在这次巡检里判不了可达性：国内和境外公共 DNS 都被改写成 127.0.0.1，说明拦的是这台 runner 而不是手机那张网" % h)
                  elif cn:
                      verdicts[h] = "ok"
                      line = "国内解析到 " + ",".join(cn[:3]) + ("（境外 " + ",".join(fg[:2]) + "）" if fg else "")
                  else:
                      verdicts[h] = "fail"
                      line = "两台公共 DNS 都没答：" + ";".join((cn_err + fg_err)[:2])
                  print("  %s -> %s" % (h, line))
              # 汇总只在「问到了答案」的前提下做：runner 在海外，到国内公共 DNS 的 UDP 有可能被过滤，
              # 那种时候两台都不答，等于这项没测——不许把它读成「国内问不到」（假红同源，只是方向相反）。
              judged = ("ok", "poisoned")
              known = [u for u in served if verdicts.get(host_of(u)) in judged]
              live_served = [u for u in known if verdicts[host_of(u)] == "ok"]
              if known and not live_served:
                  warns.append("== 上面这些「内容正确」的更新源（%s）在国内 DNS 视角下一条都问不到：这一版对手机没有可用的内置源，只能等旧更新站补发或桌面覆盖安装 ==" % ", ".join(known))
              elif live_served:
                  print("  国内可达且带本版号的腿：", ", ".join(live_served))
              elif served:
                  warns.append("公共 DNS 对上面这些域名没给出可用结论（没答或本机被拦）：手机侧可达性这一项没测出来，不下结论")


              # 下载页：用户拿到链接能不能一键下包（Pages 没开时这项必然红，那是真红不是假红）
              for base in os.environ["REPO_BASES"].split():
                  st, body, _ = fetch(base + "/download.html")
                  if st != 200:
                      fails.append("%s/download.html -> HTTP %s（用户没有可点开的下载页）" % (base, st))
                  elif b"updates/version.json" not in body:
                      fails.append("%s/download.html 内容不对（没引用 updates/version.json）" % base)
                  else:
                      print("  [%s] download.html 在" % base)

          if warns:
              print("\n---- 不判红，但要知道 ----")
              for w in warns:
                  print(" !", w)

          if fails:
              print("\n==== HEALTH CHECK FAILED ====")
              for f in fails:
                  print(" -", f)
              sys.exit(1)
          print("\n==== HEALTH OK ====")
          PY
